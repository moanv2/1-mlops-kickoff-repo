name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib matplotlib pyyaml \
                      python-dotenv wandb fastapi uvicorn pydantic httpx pytest

      - name: Run tests
        env:
          WANDB_MODE: offline
        run: |
          python -m pytest tests/ -v --tb=short
