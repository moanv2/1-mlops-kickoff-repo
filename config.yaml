# MLOps Project Configuration
# Centralizes all paths, parameters, and settings for the ML pipeline.

# ── Data Paths ────────────────────────────────────────────────
data:
  raw: "data/raw/telecom_churn.csv"
  processed: "data/processed/clean.csv"
  inference_output: "data/inference/predictions.csv"

# ── Model Artifact ────────────────────────────────────────────
model:
  path: "models/model.pkl"
  problem_type: "classification"   # "classification" or "regression"

# ── Target & Features ─────────────────────────────────────────
target:
  column: "churn"                  # lowercase after clean_data standardizes names

features:
  numeric:
    - accountweeks
    - datausage
    - custservcalls
    - daymins
    - daycalls
    - monthlycharge
    - overagefee
    - roammins
  categorical:
    - contractrenewal
    - dataplan

# ── Validation ────────────────────────────────────────────────
validation:
  required_columns:
    - AccountWeeks
    - DataUsage
    - CustServCalls
    - DayMins
    - DayCalls
    - MonthlyCharge
    - OverageFee
    - RoamMins
    - Churn
    - ContractRenewal
    - DataPlan

# ── Training ──────────────────────────────────────────────────
train:
  test_size: 0.2
  random_state: 42

# ── Evaluation ────────────────────────────────────────────────
evaluate:
  reports_dir: "reports/figures"

# ── Logging ───────────────────────────────────────────────────
logging:
  log_file: "logs/main.log"
  format: "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  level: "INFO"
